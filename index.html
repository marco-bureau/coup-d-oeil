<meta name="theme-color" content="#0F2B23" media="(prefers-color-scheme: dark)">

<style>
:root{
  --paper:#F3F5EF;
  --ink:#143A2F;
  --ink-soft:rgba(20,58,47,.64);
  --line:rgba(20,58,47,.16);
  --wash:rgba(20,58,47,.055);
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F2B23;
    --ink:#E8EEE5;
    --ink-soft:rgba(232,238,229,.66);
    --line:rgba(232,238,229,.16);
    --wash:rgba(232,238,229,.06);
    color-scheme: dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:0 22px}

/* ——— Accueil ——— */
.mast{padding:40px 0 28px}
.mast h1{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:.005em}

.shelf{list-style:none;border-top:1.5px solid var(--ink)}
.shelf>li{border-bottom:1px solid var(--line)}
.vol{display:grid;grid-template-columns:1fr auto;align-items:end;gap:16px;width:100%;text-align:left;padding:26px 0 22px}
.vol-name{font-family:var(--serif);font-size:clamp(46px,15vw,72px);line-height:.92;letter-spacing:-.025em;display:block}
.vol-sub{display:block;margin-top:12px;color:var(--ink-soft);font-size:15px}
.vol-sub b{color:var(--ink);font-weight:600}
.peek{width:72px;height:90px;object-fit:cover;border-radius:3px;background:var(--wash);display:block}
.peek.empty{display:none}

.lengths{display:none;padding:0 0 24px}
.shelf>li.open .lengths{display:block;animation:drop .22s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.lengths p{font-size:14px;color:var(--ink-soft);margin-bottom:10px}
.len-row{display:flex;gap:8px}
.len{flex:1;border:1.5px solid var(--ink);border-radius:999px;padding:12px 6px;font-weight:600;font-size:15px}
.len.main{background:var(--ink);color:var(--paper)}
.len:active{transform:scale(.97)}

.foot{padding:34px 0 40px;display:flex;flex-direction:column;gap:22px}
.offline{font-size:15px;color:var(--ink-soft);max-width:36ch}
.offline strong{color:var(--ink);font-weight:600;display:block;margin-bottom:2px}
.dl{margin-top:12px;border:1.5px solid var(--ink);border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px}
.bar{height:3px;background:var(--line);margin-top:12px;border-radius:2px;overflow:hidden;max-width:280px}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .2s}
.links{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.link{font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}

/* ——— Partie ——— */
.play{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding-bottom:18px}
.top{display:flex;justify-content:space-between;align-items:center;height:52px;font-size:15px}
.top .quit{color:var(--ink-soft);padding:8px 0}
.top .count{font-variant-numeric:tabular-nums;font-weight:600}
.top .streak{color:var(--ink-soft);margin-right:14px;font-weight:400}
.progress{height:2px;background:var(--line);margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s}
.shot{position:relative;margin:0 -22px;height:min(31vh,280px);background:var(--wash);overflow:hidden}
@media (min-width:600px){.shot{margin:0;border-radius:4px}}
.shot img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .25s}
.shot img.ok{opacity:1}
.shot.duo{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:none}
.shot.duo .ph{position:relative;background:var(--wash);overflow:hidden;display:block;padding:0}
.shot.duo .ph span{position:absolute;left:8px;bottom:8px;background:var(--paper);color:var(--ink);font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.shot .miss{font-size:13px!important;position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-soft);font-size:15px}
.line{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.ask{font-family:var(--serif);font-size:22px;line-height:1.15}
.reveal{line-height:1.25}
.reveal b{font-family:var(--serif);font-weight:400;font-size:20px;display:block}
.reveal i{color:var(--ink-soft);font-size:14px}
.next{flex:none;background:var(--ink);color:var(--paper);border-radius:999px;padding:11px 18px;font-weight:600;font-size:15px}
.choices{list-style:none;display:flex;flex-direction:column;gap:7px}
.choice{width:100%;text-align:left;min-height:50px;padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:background .15s,color .15s,border-color .15s}
.choice:active{background:var(--wash)}
.choice.right{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.choice.wrong{color:var(--ink-soft);border-color:var(--ink-soft);border-style:dashed}
.choice.wrong span:first-child{text-decoration:line-through;text-decoration-thickness:1.5px}
.choice.dim{opacity:.45}
.choice .mark{font-size:14px;font-weight:600;flex:none}

/* ——— Résultat ——— */
.result{padding:56px 0 40px}
.score{font-family:var(--serif);font-size:clamp(120px,42vw,190px);line-height:.8;letter-spacing:-.04em}
.score-of{font-family:var(--serif);font-size:28px;margin-top:10px}
.verdict{margin-top:14px;color:var(--ink-soft);max-width:34ch}
.verdict b{color:var(--ink);font-weight:600}
.actions{display:flex;gap:10px;margin:30px 0 44px}
.actions button{flex:1;border:1.5px solid var(--ink);border-radius:999px;padding:13px 8px;font-weight:600;font-size:15px}
.actions .main{background:var(--ink);color:var(--paper)}
.review h2,.records h2{font-family:var(--serif);font-weight:400;font-size:24px;margin-bottom:14px}
.review ul{list-style:none;border-top:1px solid var(--line)}
.review li{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.review img{width:56px;height:56px;object-fit:cover;border-radius:3px;background:var(--wash);display:block}
.review b{font-weight:600;display:block}
.review span{font-size:14px;color:var(--ink-soft)}
.allgood{color:var(--ink-soft)}

/* ——— Records ——— */
.records{padding:20px 0 44px}
.back{color:var(--ink-soft);font-size:15px;padding:12px 0 24px}
.records h1{font-family:var(--serif);font-weight:400;font-size:46px;letter-spacing:-.02em;margin-bottom:32px}
.records section{margin-bottom:38px}
.records table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.records th{text-align:left;font-weight:400;font-size:13px;color:var(--ink-soft);padding:0 0 8px;border-bottom:1.5px solid var(--ink)}
.records td{padding:12px 0;border-bottom:1px solid var(--line)}
.records td:first-child{font-weight:600}
.records th:not(:first-child),.records td:not(:first-child){text-align:right}
.history{margin-top:14px;font-size:14px;color:var(--ink-soft)}
.reset{font-size:14px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}

/* ——— Galerie ——— */
.gallery{padding:20px 0 44px}
.gallery h1{font-family:var(--serif);font-weight:400;font-size:46px;letter-spacing:-.02em;margin-bottom:18px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:22px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding:10px 0;z-index:2}
.tab{flex:none;border:1.5px solid var(--ink);border-radius:999px;padding:9px 18px;font-weight:600;font-size:15px}
.tab.on{background:var(--ink);color:var(--paper)}
.grid{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:18px 12px}
@media (min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
.grid button{width:100%;text-align:left;display:block}
.grid img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:3px;background:var(--wash);display:block}
.grid b{display:block;font-weight:600;font-size:15px;margin-top:7px;line-height:1.25}
.grid i{display:block;font-size:13px;color:var(--ink-soft);line-height:1.3}
.zoom{position:fixed;inset:0;z-index:10;background:var(--paper);display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 20px)}
.zoom img{width:100%;max-height:70vh;object-fit:contain;display:block}
.zoom b{font-family:var(--serif);font-weight:400;font-size:28px;display:block;margin-top:18px}
.zoom i{color:var(--ink-soft)}
.zoom p{margin-top:22px;font-size:14px;color:var(--ink-soft)}
.zoom.two img{max-height:36vh}
.zoom.two img + img{margin-top:8px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

/* ——— Stockage ——— */
function load(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function save(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){} }
let photos = load("cdo-photos", {});      // titre Wikipédia → URL de la photo
let leaves = load("cdo-leaves", {});      // arbres : titre → URL de la photo de la feuille

let cachedCount = 0;

const titleOf = s => s[2] || s[1];
const urlOf = s => photos[titleOf(s)] || null;
const leafOf = s => leaves[titleOf(s)] || null;
const allSpecies = () => [...FISH, ...FLOWERS, ...TREES];
const leafLabel = s => s[3] === "c" ? "Aiguilles" : "Feuilles";
const allUrls = () => [...new Set([...Object.values(photos), ...Object.values(leaves)])];
const untried = () => allSpecies().map(titleOf).filter(t => !photos[t] && !tried.has(t));
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ——— Photos lues depuis la mémoire du téléphone ——— */
const blobUrls = new Map();
async function srcFor(url){
  if(!url) return "";
  if(blobUrls.has(url)) return blobUrls.get(url);
  if("caches" in window){
    try{
      const cache = await caches.open(PHOTO_CACHE);
      const hit = await cache.match(url, {ignoreVary:true, ignoreSearch:false});
      if(hit){ const u = URL.createObjectURL(await hit.blob()); blobUrls.set(url, u); return u; }
    }catch(e){}
  }
  return url;
}
function hydrate(root){
  (root||app).querySelectorAll("img[data-src]").forEach(async img => {
    const u = img.dataset.src; img.removeAttribute("data-src");
    img.src = await srcFor(u);
  });
}

/* ——— Photos : recherche sur Wikipédia puis mise en cache ——— */
const API = "https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&redirects=1";
function follow(q){
  const step = {};
  (q.normalized||[]).forEach(n => step[n.from] = n.to);
  (q.redirects||[]).forEach(r => step[r.from] = r.to);
  return t => { let cur = t, guard = 0; while(step[cur] && guard++ < 4) cur = step[cur]; return cur; };
}

const LEAF = /(leaf|leaves|foliage|needle|feuill|aiguill|frond|branchlet|twig|shoot)/i;
const TREE = /(tree|habit|arbre|whole|specimen|trunk|grove|forest|stand|park|autumn|fall|winter|old)/i;
const BAD  = /(\bmaps?\b|\brange\b|distribution|logo|icon|illustration|drawing|\bplates?\b|herbari|lumber|cross.?section|seedling|stamp|chart|diagram|\bwood\b|\.svg|\.gif|\.tiff?)/i;
const PHOTO = /\.(jpe?g|png|webp)$/i;
const strongLeaf = /(leaf|leaves|needle|foliage|feuill|aiguill)/i;

async function resolveTrees(){
  const todo = TREES.map(titleOf).filter(t => !photos[t] && !tried.has(t));
  const info = {}; // titre → {lead, leadThumb, files:[]}
  for(let i=0; i<todo.length; i+=15){
    const chunk = todo.slice(i, i+15);
    let cont = {}, pages = {}, resolve = null;
    for(let guard=0; guard<20; guard++){
      const url = API + "&prop=pageimages|images&piprop=name|thumbnail&pithumbsize=500&imlimit=max&titles="
        + encodeURIComponent(chunk.join("|")) + Object.entries(cont).map(([k,v]) => "&"+k+"="+encodeURIComponent(v)).join("");
      const data = await (await fetch(url)).json();
      const q = data.query || {};
      if(!resolve) resolve = follow(q);
      (q.pages||[]).forEach(pg => {
        const x = pages[pg.title] = pages[pg.title] || {files:[]};
        if(pg.pageimage) x.lead = "File:" + pg.pageimage.replace(/_/g," ");
        if(pg.thumbnail) x.leadThumb = pg.thumbnail.source;
        (pg.images||[]).forEach(im => x.files.push(im.title));
      });
      if(!data.continue) break;
      cont = data.continue;
    }
    chunk.forEach(t => { const x = pages[resolve(t)]; if(x) info[t] = x; });
  }

  // Choix des deux photos
  const need = new Set(), pick = {};
  Object.entries(info).forEach(([t,x]) => {
    const ok = x.files.filter(f => PHOTO.test(f) && !BAD.test(f));
    let tree = x.lead && !LEAF.test(x.lead) ? x.lead : (ok.find(f => TREE.test(f) && !LEAF.test(f)) || x.lead);
    let leaf = ok.find(f => strongLeaf.test(f) && f !== tree) || ok.find(f => LEAF.test(f) && f !== tree) || null;
    pick[t] = {tree, leaf, leadThumb: x.lead === tree ? x.leadThumb : null};
    if(tree && !pick[t].leadThumb) need.add(tree);
    if(leaf) need.add(leaf);
  });

  // Adresses des miniatures
  const thumbs = {}, files = [...need];
  for(let i=0; i<files.length; i+=40){
    const chunk = files.slice(i, i+40);
    const data = await (await fetch(API + "&prop=imageinfo&iiprop=url&iiurlwidth=500&titles=" + encodeURIComponent(chunk.join("|")))).json();
    const q = data.query || {}, resolve = follow(q), by = {};
    (q.pages||[]).forEach(pg => { const ii = pg.imageinfo && pg.imageinfo[0]; if(ii) by[pg.title] = ii.thumburl || ii.url; });
    chunk.forEach(f => { const u = by[resolve(f)]; if(u) thumbs[f] = u; });
  }

  todo.forEach(t => {
    tried.add(t);
    const k = pick[t]; if(!k) return;
    const treeUrl = k.leadThumb || thumbs[k.tree];
    if(treeUrl) photos[t] = treeUrl;
    if(k.leaf && thumbs[k.leaf] && thumbs[k.leaf] !== treeUrl) leaves[t] = thumbs[k.leaf];
  });
  save("cdo-photos", photos); save("cdo-leaves", leaves); save("cdo-tried", [...tried]);
}

async function resolvePhotos(){
  const treeTitles = new Set(TREES.map(titleOf));
  const missing = [...FISH, ...FLOWERS].map(titleOf).filter(t => !photos[t] && !tried.has(t));
  for(let i=0; i<missing.length; i+=45){
    const chunk = missing.slice(i, i+45);
    const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&redirects=1"
      + "&prop=pageimages&piprop=thumbnail&pithumbsize=500&titles=" + encodeURIComponent(chunk.join("|"));
    const data = await (await fetch(url)).json();
    const q = data.query || {};
    const step = {};
    (q.normalized||[]).forEach(n => step[n.from] = n.to);
    (q.redirects||[]).forEach(r => step[r.from] = r.to);
    const byTitle = {};
    (q.pages||[]).forEach(p => { if(p.thumbnail) byTitle[p.title] = p.thumbnail.source; });
    chunk.forEach(t => {
      let cur = t, guard = 0;
      while(step[cur] && guard++ < 4) cur = step[cur];
      if(byTitle[cur]) photos[t] = byTitle[cur];
      tried.add(t);
    });
    save("cdo-photos", photos); save("cdo-tried", [...tried]);
  }
  await resolveTrees();
}

async function countCached(){
  if(!("caches" in window)) return 0;
  try{
    const cache = await caches.open(PHOTO_CACHE);
    const keys = new Set((await cache.keys()).map(r => r.url));
    return allUrls().filter(u => keys.has(u)).length;
  }catch(e){ return 0; }
}

let downloading = false;
async function downloadAll(){
  if(downloading) return;
  downloading = true;
  const status = document.querySelector("[data-status]");
  const bar = document.querySelector(".bar i");
  const say = t => { if(status) status.textContent = t; };
  try{
    say("Recherche des photos…");
    await resolvePhotos();
    const urls = allUrls();
    const cache = await caches.open(PHOTO_CACHE);
    const have = new Set((await cache.keys()).map(r => r.url));
    let done = urls.filter(u => have.has(u)).length;
    const todo = urls.filter(u => !have.has(u));
    const tick = () => { say(`Téléchargement : ${done} sur ${urls.length}`); if(bar) bar.style.width = (done/urls.length*100)+"%"; };
    tick();
    let idx = 0;
    async function worker(){
      while(idx < todo.length){
        const u = todo[idx++];
        try{ const r = await fetch(u, {mode:"cors"}); if(r.ok){ const blob = await r.blob(); await cache.put(u, new Response(blob, {headers:{"Content-Type": blob.type || "image/jpeg"}})); } }catch(e){}
        done++; tick();
      }
    }
    await Promise.all([worker(),worker(),worker(),worker(),worker()]);
  }catch(e){
    say("Le téléchargement a échoué. Vérifie ta connexion et réessaie.");
    downloading = false;
    return;
  }
  downloading = false;
  cachedCount = await countCached();
  renderHome();
}

/* ——— Accueil ——— */
function bestFor(qid){
  const r = records[qid] || {};
  let best = null;
  LENGTHS.forEach(n => { if(r[n] && r[n].plays){ if(!best || n > best.n) best = {n, s:r[n].best}; } });
  return best;
}

  const total = allSpecies().length;
  const known = allUrls().length;
  const ready = cachedCount >= known && known > 0 && untried().length === 0;
  const shelf = Object.entries(QUIZZES).map(([id,q]) => {
    const withPhoto = q.list.filter(urlOf);
    const peek = withPhoto.length ? urlOf(withPhoto[Math.floor(Math.random()*withPhoto.length)]) : "";
    const best = bestFor(id);
    const sub = best ? `${q.list.length} espèces. Record : <b>${best.s} sur ${best.n}</b>` : `${q.list.length} espèces`;
    return `<li class="${openId===id?"open":""}" data-id="${id}">

      </div>

  }).join("");

  let offline;

  }else{
    offline = `<div class="offline"><strong>Photos à télécharger</strong><span data-status>Avec le wifi : environ 15 Mo. Ensuite, l’app marche sans connexion.</span>
      <div class="bar"><i style="width:${known?cachedCount/known*100:0}%"></i></div>
      <button class="dl" data-dl>Télécharger les photos</button></div>`;
  }

  app.innerHTML = `
    <header class="mast"><h1>Quizzes Marco</h1></header>
    <ul class="shelf">${shelf}</ul>
    <div class="foot">${offline}<div class="links"><button class="link" data-gallery>Voir toutes les photos</button><button class="link" data-records>Voir mes records</button></div></div>`;
  hydrate();
}

/* ——— Partie ——— */
let game = null;

function startGame(qid, n){
  const q = QUIZZES[qid];
  const pool = q.list.filter(urlOf);
  if(pool.length < 5){
    alert("Télécharge d’abord les photos depuis l’accueil (avec une connexion internet).");
    return;
  }
  const picks = shuffle(pool).slice(0, Math.min(n, pool.length));
  const rounds = picks.map(sp => {
    const same = shuffle(pool.filter(s => s !== sp && s[3] === sp[3]));
    const other = shuffle(pool.filter(s => s !== sp && s[3] !== sp[3]));
    const wrong = [...same.slice(0,3), ...other].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);
    return {sp, options: shuffle([sp, ...wrong]), picked:null};
  });
  game = {qid, n, rounds, i:0, score:0, streak:0, bestStreak:0};
  renderRound();
}

function preload(i){
  const r = game.rounds[i];
  if(r){ srcFor(urlOf(r.sp)); if(leafOf(r.sp)) srcFor(leafOf(r.sp)); }
}
function shotHtml(sp, duo){
  if(duo && leafOf(sp)) return `<figure class="shot duo">
      <button class="ph" data-big="0"><img data-u="${esc(urlOf(sp))}" alt="Photo de l’arbre"><span>Arbre</span></button>
      <button class="ph" data-big="1"><img data-u="${esc(leafOf(sp))}" alt="Photo des ${leafLabel(sp).toLowerCase()}"><span>${leafLabel(sp)}</span></button>
    </figure>`;
  return `<figure class="shot"><img data-u="${esc(urlOf(sp))}" alt="Photo à identifier"></figure>`;
}

function renderRound(){
  const g = game, r = g.rounds[g.i], q = QUIZZES[g.qid];
  const answered = r.picked !== null;
  const correct = answered && r.picked === r.sp;
  const choices = r.options.map((o,k) => {
    let cls = "choice", mark = "";
    if(answered){
      if(o === r.sp){ cls += " right"; mark = "Bonne réponse"; }
      else if(o === r.picked){ cls += " wrong"; mark = "Ton choix"; }
      else cls += " dim";
    }
    return `<li><button class="${cls}" data-pick="${k}" ${answered?"disabled":""}><span>${esc(o[0])}</span><span class="mark">${mark}</span></button></li>`;
  }).join("");

  const line = answered
    ? `<div class="reveal"><b>${esc(r.sp[0])}</b><i>${esc(r.sp[1])}</i></div><button class="next" data-next>${g.i === g.rounds.length-1 ? "Voir le score" : "Suivante"}</button>`
    : `<p class="ask">${q.ask}</p>`;

  app.innerHTML = `<div class="play">
    <div class="top"><button class="quit" data-quit>Quitter</button>
      <span>${g.streak>=2?`<span class="streak">Série de ${g.streak}</span>`:""}<span class="count">${g.i+1} / ${g.rounds.length}</span></span></div>
    <div class="progress"><i style="width:${(g.i + (answered?1:0))/g.rounds.length*100}%"></i></div>
    ${shotHtml(r.sp, q.duo)}
    <div class="line">${line}</div>
    <ol class="choices">${choices}</ol>
  </div>`;

  app.querySelectorAll(".shot img").forEach(img => {
    img.addEventListener("load", () => img.classList.add("ok"));
    img.addEventListener("error", () => {
      if(!img.isConnected) return;
      const box = img.parentElement; img.remove();
      box.insertAdjacentHTML("beforeend", `<div class="miss">Photo pas encore sur ton téléphone. Télécharge les photos depuis l’accueil, avec le wifi.</div>`);
    });
    srcFor(img.dataset.u).then(u => { img.src = u; });
  });
  preload(g.i + 1);
}

function bigPhoto(urls, caption){
  const el = document.createElement("div");
  el.className = "zoom"; el.setAttribute("role","dialog");
  el.innerHTML = urls.map(u => `<img data-src="${esc(u)}" alt="">`).join("") + (caption||"") + `<p>Touche n’importe où pour fermer.</p>`;
  if(urls.length > 1) el.classList.add("two");
  el.addEventListener("click", () => el.remove());
  document.body.appendChild(el);
  hydrate(el);
}

function pick(k){
  const g = game, r = g.rounds[g.i];
  if(r.picked !== null) return;
  r.picked = r.options[k];
  if(r.picked === r.sp){ g.score++; g.streak++; g.bestStreak = Math.max(g.bestStreak, g.streak); }
  else g.streak = 0;
  if(navigator.vibrate && r.picked !== r.sp) navigator.vibrate(30);
  renderRound();
}

function next(){
  if(game.i < game.rounds.length - 1){ game.i++; renderRound(); }
  else finish();
}

function finish(){
  const g = game;
  const total = g.rounds.length;
  records[g.qid] = records[g.qid] || {};
  const rec = records[g.qid][g.n] || {best:0, bestStreak:0, plays:0, history:[]};
  const isRecord = rec.plays > 0 && g.score > rec.best;
  const first = rec.plays === 0;
  const prevBest = rec.best;
  rec.best = Math.max(rec.best, g.score);
  rec.bestStreak = Math.max(rec.bestStreak, g.bestStreak);
  rec.plays++;
  rec.history = [{s:g.score, t:total, d:Date.now()}, ...rec.history].slice(0, 10);
  records[g.qid][g.n] = rec;
  save("cdo-records", records);

  let verdict;
  if(isRecord) verdict = `<b>Nouveau record.</b> L’ancien était ${prevBest}.`;
  else if(first) verdict = `Premier score enregistré pour cette longueur.`;
  else if(g.score === rec.best) verdict = `Tu égales ton record.`;
  else verdict = `Ton record est de <b>${rec.best}</b>.`;
  if(g.bestStreak >= 3) verdict += ` Meilleure série : ${g.bestStreak} d’affilée.`;

  const missed = g.rounds.filter(r => r.picked !== r.sp);
  const review = missed.length
    ? `<ul>${missed.map(r => `<li><img data-src="${esc(urlOf(r.sp))}" alt=""><div><b>${esc(r.sp[0])}</b><span>Tu as répondu ${esc(r.picked[0])}</span></div></li>`).join("")}</ul>`
    : `<p class="allgood">Aucune erreur.</p>`;

  app.innerHTML = `<div class="result">
    <div class="score">${g.score}</div>
    <div class="score-of">sur ${total}</div>
    <p class="verdict">${verdict}</p>
    <div class="actions"><button class="main" data-again>Rejouer</button><button data-home>Accueil</button></div>
    <div class="review"><h2>À revoir</h2>${review}</div>
  </div>`;
  hydrate();
  window.scrollTo(0,0);
}

/* ——— Galerie ——— */
let galleryTab = "fish";
function renderGallery(){
  const q = QUIZZES[galleryTab];
  const items = q.list.map((s,k) => urlOf(s)
    ? `<li><button data-zoom="${k}"><img data-src="${esc(urlOf(s))}" alt="${esc(s[0])}" loading="lazy"><b>${esc(s[0])}</b><i>${esc(s[1])}</i></button></li>`
    : `<li><img alt=""><b>${esc(s[0])}</b><i>${esc(s[1])}</i></li>`).join("");
  app.innerHTML = `<div class="gallery"><button class="back" data-home>Retour</button><h1>Toutes les photos</h1>
    <div class="tabs">${Object.entries(QUIZZES).map(([id,x]) => `<button class="tab ${id===galleryTab?"on":""}" data-tab="${id}">${x.name}</button>`).join("")}</div>
    <ul class="grid">${items}</ul></div>`;
  hydrate();
}
function zoom(k){
  const s = QUIZZES[galleryTab].list[k];
  bigPhoto([urlOf(s), leafOf(s)].filter(Boolean), `<b>${esc(s[0])}</b><i>${esc(s[1])}</i>`);
}

/* ——— Records ——— */
function renderRecords(){
  const blocks = Object.entries(QUIZZES).map(([id,q]) => {
    const r = records[id] || {};
    const rows = LENGTHS.map(n => {
      const x = r[n];
      return `<tr><td>${n} questions</td><td>${x?x.best:"–"}</td><td>${x?x.bestStreak:"–"}</td><td>${x?x.plays:0}</td></tr>`;
    }).join("");
    const last = LENGTHS.flatMap(n => (r[n]?.history||[])).sort((a,b)=>b.d-a.d).slice(0,5);
    const hist = last.length ? `<p class="history">Dernières parties : ${last.map(h=>`${h.s}/${h.t}`).join(", ")}</p>` : "";
    return `<section><h2>${q.name}</h2>
      <table><thead><tr><th>Partie</th><th>Record</th><th>Série</th><th>Jouées</th></tr></thead><tbody>${rows}</tbody></table>${hist}</section>`;
  }).join("");
  app.innerHTML = `<div class="records"><button class="back" data-home>Retour</button><h1>Records</h1>${blocks}
    <button class="reset" data-reset>Effacer tous les records</button></div>`;
  window.scrollTo(0,0);
}

/* ——— Événements ——— */
app.addEventListener("click", e => {
  const t = e.target.closest("button");
  if(!t) return;
  if(t.dataset.open){
    const li = t.closest("li");
    renderHome(li.classList.contains("open") ? null : t.dataset.open);
  }
  else if(t.dataset.start) startGame(t.dataset.start, +t.dataset.n);
  else if(t.dataset.pick !== undefined) pick(+t.dataset.pick);
  else if("next" in t.dataset) next();
  else if("quit" in t.dataset){ if(confirm("Quitter la partie ? Ce score ne sera pas enregistré.")) renderHome(); }
  else if("again" in t.dataset) startGame(game.qid, game.n);
  else if("home" in t.dataset){ renderHome(); window.scrollTo(0,0); }
  else if("records" in t.dataset) renderRecords();
  else if("gallery" in t.dataset){ renderGallery(); window.scrollTo(0,0); }
  else if(t.dataset.tab){ galleryTab = t.dataset.tab; renderGallery(); window.scrollTo(0,0); }
  else if(t.dataset.zoom !== undefined) zoom(+t.dataset.zoom);
  else if(t.dataset.big !== undefined){ const r = game.rounds[game.i]; bigPhoto([t.dataset.big === "0" ? urlOf(r.sp) : leafOf(r.sp)]); }
  else if("reset" in t.dataset){ if(confirm("Effacer tous les records ?")){ records = {}; save("cdo-records", records); renderRecords(); } }
  else if("dl" in t.dataset){ t.disabled = true; t.textContent = "En cours…"; downloadAll(); }
});

/* ——— Démarrage ——— */
(async function init(){
  if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
    try{ await navigator.serviceWorker.register("sw.js"); }catch(e){}
  }
  if(navigator.storage && navigator.storage.persist){ try{ navigator.storage.persist(); }catch(e){} }
  cachedCount = await countCached();
  renderHome();
})();
</script>
</body>
